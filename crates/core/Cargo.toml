[package]
name = "mailbackup-core"
version = "0.1.0"
edition = "2021"

[features]
testing = []

[dependencies]
mail-parser = "0.11.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
