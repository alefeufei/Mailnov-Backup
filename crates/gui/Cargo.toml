[package]
name = "mailbackup-gui"
version = "0.1.0"
edition = "2021"
description = "MailBackup desktop app (Tauri v2)"

[[bin]]
name = "MailBackup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mailbackup-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"

[dev-dependencies]
mailbackup-core = { path = "../core", features = ["testing"] }
tempfile = "3.27.0"
