[package]
name = "mailbackup"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mailbackup"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
indicatif = "0.18.6"
mailbackup-core = { path = "../core" }
rpassword = "7.5.4"

[dev-dependencies]
assert_cmd = "2.2.2"
mailbackup-core = { path = "../core", features = ["testing"] }
tempfile = "3.27.0"

[features]
# TEST ONLY: swaps the OS credential store for a PLAINTEXT file-based store. Never enable in a
# release build.
test-secrets = []

[[test]]
name = "cli"
required-features = ["test-secrets"]

[[test]]
name = "e2e_dovecot"
required-features = ["test-secrets"]
