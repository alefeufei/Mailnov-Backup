# TEST ONLY Dovecot 2.3 configuration for mailbackup's e2e tests. Never use in production.
protocols = imap
listen = *
log_path = /dev/stderr
ssl = required
ssl_cert = </certs/server.crt
ssl_key = </certs/server.key
disable_plaintext_auth = yes
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/tmp/vmail/%u
}

# LAYOUT=fs: "/" is the hierarchy separator, nested folders are real directories.
mail_location = maildir:~/Maildir:LAYOUT=fs

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts { special_use = \Drafts }
  mailbox Sent { special_use = \Sent }
  mailbox Trash { special_use = \Trash }
}

service imap-login {
  inet_listener imap { port = 0 }
  inet_listener imaps { port = 993; ssl = yes }
}
