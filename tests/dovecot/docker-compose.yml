# TEST ONLY Dovecot for mailbackup's ignored integration/e2e tests. See README.md.
# Needs ./certs from `sh make-certs.sh` (CA trusted by the OS). Not run on the dev machine that
# wrote it (no Docker there): treat it as untested until you have run it once.
# State is ephemeral on purpose: `docker compose down` gives the e2e a fresh, empty mailbox.
services:
  dovecot:
    image: dovecot/dovecot:2.3.21.1
    ports:
      - "993:993"
    volumes:
      - ./conf/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./users:/etc/dovecot/users:ro
      - ./certs:/certs:ro
