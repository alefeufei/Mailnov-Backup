<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Suave -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Corpo do Envelope -->
  <rect x="12" y="19" width="40" height="27" rx="4" fill="#ffffff"/>

  <!-- Aba e Dobras do Envelope -->
  <path d="M 12 21 L 32 35 L 52 21" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 13 45 L 26 32" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 51 45 L 38 32" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Emblema de Backup Seguro com Checkmark -->
  <circle cx="48" cy="46" r="11" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M 44.5 46 L 47 48.5 L 52 43.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
